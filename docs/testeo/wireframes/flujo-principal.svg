<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <title>TutorLink – Wireframes del flujo principal</title>
  <style>
    .phone { fill: #ffffff; stroke: #333333; stroke-width: 2; }
    .box { fill: #eeeeee; stroke: #999999; }
    .bar { fill: #dddddd; stroke: #999999; }
    .accent { fill: #cfe8cf; stroke: #3d7a3d; }
    .t { fill: #222222; }
    .s { fill: #666666; font-size: 10px; }
    .h { font-weight: bold; font-size: 14px; fill: #222222; }
    .step { font-weight: bold; font-size: 16px; fill: #1f5c1f; }
    .arrow { stroke: #1f5c1f; stroke-width: 2; fill: none; marker-end: url(#a); }
    .err { fill: #b3261e; font-size: 10px; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f5c1f"/>
    </marker>
  </defs>

  <rect width="1240" height="620" fill="#fafafa"/>
  <text x="620" y="30" text-anchor="middle" class="h" font-size="18">TutorLink · Flujo principal (wireframes de baja fidelidad)</text>

  <!-- 1. Inicio -->
  <text x="40" y="65" class="step">1. Inicio</text>
  <rect x="40" y="75" width="250" height="500" rx="22" class="phone"/>
  <rect x="55" y="95" width="220" height="30" class="bar"/>
  <circle cx="72" cy="110" r="10" class="box"/><text x="88" y="114" class="t">TutorLink</text>
  <circle cx="258" cy="110" r="10" class="box"/>
  <text x="55" y="150" class="h">¡Hola, Andrea!</text>
  <text x="55" y="166" class="s">¿Qué quieres aprender hoy?</text>
  <rect x="55" y="178" width="220" height="28" rx="8" class="box"/><text x="65" y="196" class="s">🔍 Busca por tutor o materia  →</text>
  <text x="55" y="226" class="t" font-weight="bold">Materias populares</text>
  <rect x="55" y="234" width="68" height="22" rx="11" class="accent"/><rect x="128" y="234" width="60" height="22" rx="11" class="accent"/><rect x="193" y="234" width="60" height="22" rx="11" class="accent"/>
  <text x="55" y="276" class="t" font-weight="bold">Tutores recomendados</text>
  <rect x="55" y="284" width="220" height="56" rx="8" class="box"/><circle cx="78" cy="312" r="14" fill="#ffffff" stroke="#999"/><text x="100" y="306" class="t">Nombre tutor</text><text x="100" y="322" class="s">Especialidad · ★ · Q/hora</text>
  <rect x="55" y="346" width="220" height="56" rx="8" class="box"/><circle cx="78" cy="374" r="14" fill="#ffffff" stroke="#999"/><text x="100" y="368" class="t">Nombre tutor</text><text x="100" y="384" class="s">Especialidad · ★ · Q/hora</text>
  <text x="55" y="424" class="t" font-weight="bold">Próxima tutoría</text><text x="200" y="424" class="s">Ver calendario</text>
  <rect x="55" y="432" width="220" height="50" rx="8" class="box"/><text x="65" y="460" class="s">Tema · tutor · fecha · hora</text>
  <rect x="55" y="520" width="220" height="40" class="bar"/><text x="165" y="544" text-anchor="middle" class="s">Inicio · Buscar · Calendario · Configuración</text>

  <path d="M292 320 L335 320" class="arrow"/>

  <!-- 2. Buscar -->
  <text x="340" y="65" class="step">2. Buscar</text>
  <rect x="340" y="75" width="250" height="500" rx="22" class="phone"/>
  <rect x="355" y="95" width="220" height="30" class="bar"/>
  <text x="355" y="150" class="h">Encuentra tu tutor</text>
  <text x="355" y="166" class="s">Filtra por materia o escribe…</text>
  <rect x="355" y="178" width="220" height="30" rx="8" fill="#fff" stroke="#666"/><text x="365" y="197" class="s">🔍 Texto de búsqueda        ✕</text>
  <rect x="355" y="216" width="46" height="22" rx="6" class="accent"/><text x="365" y="231" class="s">Todas</text>
  <rect x="406" y="216" width="70" height="22" rx="6" class="box"/><rect x="481" y="216" width="60" height="22" rx="6" class="box"/><rect x="546" y="216" width="29" height="22" rx="6" class="box"/>
  <text x="355" y="262" class="t" font-weight="bold">N resultados</text>
  <rect x="355" y="272" width="220" height="56" rx="8" class="box"/><text x="400" y="304" class="t">Tarjeta de tutor</text>
  <rect x="355" y="334" width="220" height="56" rx="8" class="box"/><text x="400" y="366" class="t">Tarjeta de tutor</text>
  <rect x="355" y="396" width="220" height="56" rx="8" class="box" stroke-dasharray="4 3"/><text x="465" y="420" text-anchor="middle" class="s">Estado vacío:</text><text x="465" y="436" text-anchor="middle" class="s">"No encontramos tutores"</text>
  <rect x="355" y="520" width="220" height="40" class="bar"/><text x="465" y="544" text-anchor="middle" class="s">Barra de navegación inferior</text>

  <path d="M592 320 L635 320" class="arrow"/>

  <!-- 3. Detalle y reserva -->
  <text x="640" y="65" class="step">3. Detalle y reserva</text>
  <rect x="640" y="75" width="250" height="500" rx="22" class="phone"/>
  <rect x="655" y="95" width="220" height="30" class="bar"/><text x="665" y="114" class="t">← Detalle y reserva</text>
  <circle cx="680" cy="155" r="20" class="box"/><text x="708" y="150" class="t" font-weight="bold">Nombre tutor</text><text x="708" y="166" class="s">Especialidad · ★ · Q/hora</text>
  <rect x="655" y="184" width="220" height="26" class="box"/><text x="665" y="201" class="s">Descripción del tutor</text>
  <text x="655" y="226" class="s">Disponibilidad aproximada</text>
  <rect x="655" y="232" width="70" height="18" rx="5" class="accent"/><rect x="730" y="232" width="70" height="18" rx="5" class="accent"/><rect x="805" y="232" width="70" height="18" rx="5" class="accent"/>
  <text x="655" y="272" class="h">Solicita una tutoría</text>
  <rect x="655" y="282" width="220" height="30" rx="6" fill="#fff" stroke="#666"/><text x="665" y="301" class="s">Materia o tema *</text>
  <rect x="655" y="320" width="220" height="30" rx="6" fill="#fff" stroke="#b3261e"/><text x="665" y="339" class="s">Fecha * (AAAA-MM-DD)</text>
  <text x="660" y="362" class="err">Mensaje de error en tiempo real</text>
  <rect x="655" y="370" width="220" height="30" rx="6" fill="#fff" stroke="#666"/><text x="665" y="389" class="s">Hora * (HH:MM)</text>
  <rect x="655" y="408" width="220" height="50" rx="6" fill="#fff" stroke="#666"/><text x="665" y="427" class="s">Notas (opcional)</text><text x="868" y="452" text-anchor="end" class="s">0/250</text>
  <rect x="655" y="470" width="220" height="34" rx="8" fill="#bbbbbb"/><text x="765" y="491" text-anchor="middle" class="t">Reservar tutoría</text>
  <text x="765" y="520" text-anchor="middle" class="s">(deshabilitado hasta que el formulario es válido)</text>
  <rect x="655" y="532" width="220" height="26" rx="8" fill="#fff" stroke="#666"/><text x="765" y="549" text-anchor="middle" class="s">Ver calendario (tras reservar)</text>

  <path d="M892 320 L935 320" class="arrow"/>

  <!-- 4. Calendario -->
  <text x="940" y="65" class="step">4. Mis tutorías</text>
  <rect x="940" y="75" width="250" height="500" rx="22" class="phone"/>
  <rect x="955" y="95" width="220" height="30" class="bar"/>
  <text x="955" y="150" class="h">Mis tutorías</text>
  <text x="955" y="166" class="s">Consulta y organiza tus sesiones</text>
  <rect x="955" y="178" width="70" height="22" rx="6" class="accent"/><text x="964" y="193" class="s">Próximas</text>
  <rect x="1030" y="178" width="84" height="22" rx="6" class="box"/><text x="1038" y="193" class="s">Completadas</text>
  <rect x="955" y="212" width="220" height="64" rx="8" class="box"/><text x="965" y="236" class="t">Tema de la sesión</text><text x="965" y="254" class="s">Tutor · fecha · hora · estado</text>
  <rect x="955" y="284" width="220" height="64" rx="8" class="accent"/><text x="965" y="308" class="t">Nueva reserva</text><text x="965" y="326" class="s">Aparece al confirmar en el paso 3</text>
  <rect x="955" y="520" width="220" height="40" class="bar"/><text x="1065" y="544" text-anchor="middle" class="s">Barra de navegación inferior</text>

  <text x="620" y="605" text-anchor="middle" class="s">Login y Configuración son pantallas de marcador (un botón): no forman parte del flujo evaluado.</text>
</svg>
